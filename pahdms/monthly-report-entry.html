<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Monthly Report Entry | PAHDMS</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js?v=2"></script>
<script src="js/common.js?v=5"></script><style>
:root{--primary:#176b4d;--accent:#b7791f;--bg:#f5f7f6;--border:#d8dfdc;--text:#1f2937;--muted:#6b7280;--danger:#b91c1c;--success:#166534}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}header{background:var(--primary);color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:15px}.subtitle{opacity:.9;font-size:13px;margin-top:4px}.status-badge{padding:7px 12px;border-radius:20px;background:#fff;color:#333;font-weight:700}.status-badge.submitted{background:#dbeafe;color:#1d4ed8}.status-badge.verified{background:#dcfce7;color:#166534}.status-badge.approved{background:#d1fae5;color:#065f46}.status-badge.locked{background:#e5e7eb;color:#374151}.container{max-width:1400px;margin:0 auto;padding:20px}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:15px}.btn{border:0;border-radius:6px;background:var(--primary);color:#fff;padding:9px 14px;cursor:pointer;font-weight:600}.btn.secondary{background:#4b5563}.btn:disabled{opacity:.55;cursor:not-allowed}.message{display:none;position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:14px 20px;border-radius:7px;margin-bottom:15px;z-index:9999;box-shadow:0 4px 14px rgba(0,0,0,.25);min-width:280px;text-align:center;font-weight:600}.message.success{background:#dcfce7;color:var(--success)}.message.error{background:#fee2e2;color:var(--danger)}.info-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.info-card{background:#fff;border:1px solid var(--border);border-radius:8px;padding:12px}.info-card span{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.info-card strong{font-size:14px}.status-area{background:#fff;border:1px solid var(--border);padding:12px;border-radius:8px;display:flex;align-items:end;gap:10px;margin-bottom:15px}.status-area label{font-size:12px;color:var(--muted);display:block}.status-area select{padding:9px;border:1px solid var(--border);border-radius:6px}.accordion{background:#fff;border:1px solid var(--border);border-radius:8px;margin-bottom:10px;overflow:hidden}.accordion-head{width:100%;border:0;background:#fff;padding:15px 17px;display:flex;justify-content:space-between;align-items:center;font-size:16px;font-weight:700;cursor:pointer;text-align:left}.accordion-body{display:none;padding:16px;border-top:1px solid var(--border)}.accordion.open .accordion-body{display:block}.accordion.open .accordion-head span:last-child{transform:rotate(90deg)}.field-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.field-grid.one{grid-template-columns:1fr}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;color:var(--muted);font-weight:600}.field input{width:100%;padding:8px;border:1px solid var(--border);border-radius:5px}.readonly{background:#f3f4f6!important;color:#6b7280}.field-group{margin-bottom:16px}.field-group h5,.matrix-block h4{margin:0 0 8px;color:var(--accent);font-size:13px;text-transform:uppercase;letter-spacing:.5px}.table-wrap{overflow:auto;margin-bottom:15px}.data-table{width:100%;border-collapse:collapse;min-width:700px}.data-table th,.data-table td{border:1px solid var(--border);padding:8px;text-align:center;font-size:12px}.data-table th{background:#eef3f0}.data-table td input{width:85px;padding:6px;border:1px solid var(--border);border-radius:4px}.row-label{text-align:left!important;font-weight:600;white-space:nowrap}.total-row{background:#f8faf9;font-weight:700}.group-total{background:#fff8eb;font-weight:700}.matrix-block{margin:18px 0}.matrix-block small{color:var(--muted)}.totals-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px}.save-row{display:flex;justify-content:flex-end;margin-top:15px}.loading{background:#fff;border:1px solid var(--border);padding:25px;border-radius:8px;text-align:center;color:var(--muted)}@media(max-width:900px){.info-grid,.field-grid,.totals-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.info-grid,.field-grid,.totals-grid{grid-template-columns:1fr}.container{padding:10px}.toolbar{align-items:stretch;flex-direction:column}.status-area{flex-wrap:wrap}}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}
input[type=number] {
  -moz-appearance: textfield;
  appearance: textfield;
}.field-error{border:2px solid #dc2626!important;background:#fef2f2!important}
</style></head><body><header id="reportHeader"><div><h1>Monthly Report Entry</h1><div class="subtitle">Loading...</div></div></header><div class="container"><div class="toolbar"><button id="backBtn" class="btn secondary">← Back to Monthly Reports</button><strong>PAHDMS — Fazilka District</strong></div><div id="message" class="message"></div><div id="loading" class="loading">Loading Monthly Report...</div><div id="reportInfo" class="info-grid"></div><div id="statusArea" class="status-area"></div><div id="mprBody"></div></div><script src="monthly-report-entry.js?v=4"></script></body></html>
