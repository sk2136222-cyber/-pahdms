<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Settings | Punjab AHMS</title>

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="stylesheet" href="css/app.css?v=2">
<link rel="stylesheet" href="css/mobile.css?v=2">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js?v=2"></script>
<script src="js/common.js?v=5"></script>
<script src="js/settings.js?v=2" defer></script>

<style>

.card{
    background:#fff;
    border-radius:10px;
    padding:20px;
    margin-bottom:25px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.card h3{
    margin-bottom:15px;
    color:#0B6E4F;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.card input{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:15px;
}

.card input:disabled{
    background:#f2f2f2;
    color:#888;
}

.card button{
    background:#0B6E4F;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:5px;
    cursor:pointer;
    font-size:14px;
    margin-top:15px;
}

.card button:hover{
    background:#09553d;
}

.readonly-info{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-bottom:15px;
}

.readonly-info div{
    background:#f7f9f8;
    padding:10px 15px;
    border-radius:6px;
}

.readonly-info span{
    display:block;
    font-size:12px;
    color:#888;
    margin-bottom:3px;
}

.badge{
    background:#0B6E4F;
    color:white;
    padding:6px 12px;
    border-radius:20px;
    font-size:13px;
    font-weight:bold;
}

@media(max-width:900px){
    .form-grid,.readonly-info{grid-template-columns:1fr}
}

</style>

</head>

<body>

<div class="layout">

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="logo">
            <i class="fa-solid fa-cow"></i>
            <h2>PAHDMS</h2>
            <p>Fazilka District</p>
        </div>

        <nav>
            <a href="dashboard.html">
                <i class="fa-solid fa-house"></i>
                Dashboard
            </a>

            <a href="institution.html">
                <i class="fa-solid fa-building"></i>
                Institutions
            </a>

            <a href="employee_new.html">
                <i class="fa-solid fa-user-doctor"></i>
                Employees
            </a>

            <a href="user-management.html">
                <i class="fa-solid fa-users"></i>
                User Management
            </a>

            <a href="monthly-report.html">
                <i class="fa-solid fa-clipboard-list"></i>
                Monthly Report
            </a>

            <a href="reports.html">
                <i class="fa-solid fa-chart-column"></i>
                Reports
            </a>

            <a href="live-tracking.html">
                <i class="fa-solid fa-location-dot"></i>
                Live Tracking
            </a>

            <a class="active" href="settings.html">
                <i class="fa-solid fa-gear"></i>
                Settings
            </a>
        </nav>

    </aside>

    <!-- Main Content -->
    <main class="content main-content">

        <div class="page-header">
            <div>
                <h1>
                    <i class="fa-solid fa-gear"></i>
                    Settings
                </h1>
                <p>Punjab Animal Husbandry Department • Fazilka</p>
            </div>
            <div class="header-buttons" style="display:flex;align-items:center;gap:14px;">
                <div class="user-info" style="text-align:right;font-size:13px;line-height:1.3;">
                    <div id="loggedUserName" style="font-weight:600;color:#222;">User Name</div>
                    <div id="loggedUserRole" style="font-size:12px;color:#888;text-transform:capitalize;">Role</div>
                </div>
                <button class="logout-btn" onclick="logout()" type="button">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    Logout
                </button>
            </div>
        </div>

        <!-- Account Info -->
        <div class="card">

            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;">
                <h3>My Account</h3>
                <span class="badge" id="myRoleBadge">Role</span>
            </div>

            <div class="readonly-info">
                <div>
                    <span>Full Name</span>
                    <strong id="myFullName">-</strong>
                </div>
                <div>
                    <span>Username</span>
                    <strong id="myUsername">-</strong>
                </div>
            </div>

        </div>

        <!-- Change Password -->
        <div class="card">

            <h3>Change Password</h3>

            <div class="form-grid">
                <input type="password" id="newPassword" placeholder="New Password (min 6 characters)">
                <input type="password" id="confirmPassword" placeholder="Confirm New Password">
            </div>

            <button id="changePasswordBtn" type="button">
                🔒 Update Password
            </button>

        </div>

        <!-- Department Info -->
        <div class="card">

            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;">
                <h3>Department Info</h3>
                <span class="badge" id="adminOnlyBadge" style="display:none;background:#6c757d;">
                    View Only
                </span>
            </div>

            <div class="form-grid">
                <input type="text" id="departmentName" placeholder="Department Name">
                <input type="text" id="districtName" placeholder="District Name">
                <input type="email" id="contactEmail" placeholder="Contact Email">
                <input type="text" id="contactPhone" placeholder="Contact Phone">
            </div>

            <button id="saveDepartmentBtn" type="button">
                💾 Save Department Info
            </button>

        </div>

    </main>

</div>

</body>

</html>
