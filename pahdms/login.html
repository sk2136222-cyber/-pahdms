<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Punjab AHMS Login</title>
<link rel="stylesheet" href="css/login.css?v=2">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js?v=2"></script>
<script src="js/login.js?v=3" defer></script>

</head>

<body>

<div class="login-card">

    <div class="logo">

        <h2>Punjab Animal Husbandry</h2>

        <p>Punjab Animal Husbandry Management System</p>

    </div>

    <div class="input-group">

        <label>Username</label>

        <input
            type="text"
            id="username"
            placeholder="Enter Username">

    </div>

    <div class="input-group">

    <label>Password</label>

    <div class="password-box">

        <input
            type="password"
            id="password"
            placeholder="Enter Password">

        <i
            id="togglePassword"
            class="fa-solid fa-eye toggle-password">
        </i>

    </div>

</div>

<div class="remember-row">

    <label>

        <input
            type="checkbox"
            id="rememberMe">

        Remember Me

    </label>

</div>

<button
    class="login-btn"
    id="loginBtn">

    Login

</button>

    <div class="footer">

        Punjab Animal Husbandry Department<br>
        District Management System V5

    </div>

</div>

</body>
</html>
